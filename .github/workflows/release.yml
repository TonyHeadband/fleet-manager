name: Release

# A v* tag builds the Windows and Linux archives with scripts/bundle.sh and attaches them to a draft release, which
# the owner checks and publishes by hand: only a published release reaches the README link and the app's update
# notice. A manual run builds the archives as workflow artifacts and creates no release.
#
# A version with a suffix (`0.3.0-beta.1`) is a pre-release: it may be tagged on any branch, and GitHub marks its
# release as one, so neither the README link nor the app's update notice (both read `releases/latest`) offers it.
# A plain version is tagged only on `main` or a `release/*` branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "workspace version $version"
      - name: The tag names that version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $VERSION (expected v$VERSION)"
            exit 1
          }
      - name: The version has its notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        # A pre-release may go out with what is gathered so far.
        run: |
          notes="packaging/changes/v$VERSION.md"
          if [ ! -s "$notes" ] && [ "$PRERELEASE" = true ]; then
            notes=packaging/changes/unreleased.md
          fi
          [ -s "$notes" ] || {
            echo "::error::packaging/changes/v$VERSION.md is missing: write what's new in this version"
            exit 1
          }
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: A release is tagged on main or a release branch
        if: github.ref_type == 'tag' && steps.version.outputs.prerelease == 'false'
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -Eq '^ *origin/(main|release/.+)$' || {
            echo "::error::$GITHUB_SHA is on neither main nor a release/* branch; tag a pre-release (v<version>-<suffix>) instead"
            exit 1
          }
      - name: CI passed on the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # A branch other than main and release/* gets CI only through its pull request.
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion,event -q '[.[] | select(.event == "push" or .event == "pull_request")][0].conclusion')"
          [ "$conclusion" = success ] || {
            echo "::error::CI on $GITHUB_SHA is '${conclusion:-not run}'; tag a commit whose CI passed"
            exit 1
          }

  build:
    needs: check
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: zig and cargo-zigbuild (glibc 2.28 builds)
        if: matrix.os == 'linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --quiet ziglang
          echo "CARGO_ZIGBUILD_ZIG_PATH=$(ls "$RUNNER_TEMP"/zig-venv/lib/python*/site-packages/ziglang/zig)" >> "$GITHUB_ENV"
          cargo install --locked cargo-zigbuild
      - name: Build the archive
        shell: bash
        run: bash scripts/bundle.sh --os ${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.os }}
          path: dist/fleet-manager-v*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum fleet-manager-v* > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          NOTES: ${{ needs.check.outputs.notes }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        # What's new in this version, then the fixed download and feedback section. GitHub's generated notes are not
        # used: they list only merged pull requests, and most work lands on main directly.
        run: |
          { cat "$NOTES"; echo; cat packaging/release-notes.md; } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/fleet-manager-v* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --prerelease="$PRERELEASE" \
            --title "Fleet Manager v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
