name: CI (Windows)

# Each OS has its own workflow, so a release can ship an OS's archive as soon as that OS is green (release.yml).
on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still going.
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Windows and macOS see two names that differ only by case as one file.
      - name: No file names that differ only by case
        shell: bash
        run: bash scripts/case-twins.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Saved even when the run fails, so a red branch doesn't compile from scratch every time; the debug test build
      # and the release tauri build keep separate caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      # Windows runners default TEMP to an 8.3 short path (C:\Users\RUNNER~1\…), which the app canonicalizes to the
      # long form while tests compare against the short one. RUNNER_TEMP is a plain long path on every OS.
      - name: Use the runner's own temp folder
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The web UI's own tests, and its build, which the daemon and the Tauri app embed. As on Linux; formatting is
      # checked there only, since it is the same on every OS.
      - name: Web UI
        shell: bash
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web test
          pnpm --dir web typecheck
          pnpm --dir web build
      # After the web build, so the daemon embeds the real UI as it does in the tests below. Windows-only code is
      # linted only here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -j2
      - name: No files changed by the build or tests
        shell: bash
        run: git diff --exit-code

  # The Tauri app's smoke test against a real daemon, as on Linux: WebdriverIO drives the release app in WebView2
  # through tauri-driver and an msedgedriver matched to the runner's WebView2. No packages: Windows ships a portable zip.
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Saved even when the run fails, so a red branch doesn't compile from scratch every time; the debug test build
      # and the release tauri build keep separate caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      # The app, the daemon it reaches, and the smoke test's stand-ins for claude, gh and GitHub's API.
      - run: cargo build --release --locked -p fleet-daemon -p fleet-client -p fleet-demo -p fleet-tauri --bins
      # tauri-driver is built once per version and kept, not compiled on every run.
      - id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver*
          key: tauri-driver-2.1.0-${{ runner.os }}
      - if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: TEMPORARY WebView2 debug
        shell: bash
        continue-on-error: true
        run: bash scripts/zz-webview2-debug.sh
      - name: Smoke test
        shell: bash
        run: |
          FLEET_NATIVE_DRIVER=$(scripts/msedgedriver.sh "$RUNNER_TEMP/edgedriver")
          export FLEET_NATIVE_DRIVER
          scripts/tauri-smoke.sh
