name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS reports without blocking: it is not a required platform yet.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Windows runners default TEMP to an 8.3 short path (C:\Users\RUNNER~1\…), which the app canonicalizes to the
      # long form while tests compare against the short one. RUNNER_TEMP is a plain long path on every OS.
      - name: Use the runner's own temp folder
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Names what holds a test's folder when Windows refuses to delete or rename it (see `when_released` in the
      # daemon's tests). Temporary: remove with that helper once the holder is known.
      - name: Install Sysinternals handle
        if: runner.os == 'Windows'
        run: choco install handle -y --no-progress
      - run: cargo test --workspace --locked -j2
      - name: Folder holders seen by the tests
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          f="$RUNNER_TEMP/fleet-folder-holders.log"
          if [ -s "$f" ]; then cat "$f"; echo "::warning::a test folder was held by another process; see this step's log"; else echo none; fi
      # No demo-media check here: stale media must not fail a pull request; demo-media.yml re-records on main.
      - name: No files changed by the build or tests
        shell: bash
        run: git diff --exit-code
