name: Demo media

# Re-records docs/assets/ when a change to what the demo shows lands on main, and lands it through one pull request
# that the workflow merges itself when it holds only media. The paths are the DEMO_INPUTS in scripts/demo.sh
# (scripts/test-demo-lock.sh checks they stay covered).
on:
  push:
    branches: [main]
    paths: [crates/fleet-gui/**, crates/fleet-client/**, crates/fleet-api/**, crates/fleet-demo/**, crates/fleet-daemon/src/status.rs, fixtures/hooks/**, demo/**, scripts/demo.sh, Cargo.lock]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# A newer push supersedes a recording still running: only the latest main is worth recording.
concurrency:
  group: demo-media
  cancel-in-progress: true

env:
  BRANCH: ci/demo-media
  TITLE: "docs: re-record the demo media"
  GH_TOKEN: ${{ github.token }}

jobs:
  record:
    # Paused on push while V1 changes a lot (user, 2026-10-28); a manual run (workflow_dispatch) still works.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - id: check
        name: Check the lock
        run: |
          if scripts/demo.sh --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.stale == 'true'
        name: Install recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils ffmpeg \
            libgl1-mesa-dri libegl1 libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev

      - if: steps.check.outputs.stale == 'true'
        uses: Swatinem/rust-cache@v2

      - if: steps.check.outputs.stale == 'true'
        name: Record
        run: scripts/demo.sh

      - if: steps.check.outputs.stale == 'true'
        name: Open or update the pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/assets/ demo/demo.lock
          git commit -m "$TITLE" -m "Recorded by the Demo media workflow from $GITHUB_SHA."
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main --title "$TITLE" \
              --body "Re-recorded by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA. The workflow merges it itself when it holds only the media and the lock; anything else waits for a person."
          fi

      # Media and the lock carry no code, so nothing needs a review before they go live; a revert undoes a bad take.
      # Anything else on the branch (someone pushed to it) leaves the pull request open for a person.
      - if: steps.check.outputs.stale == 'true'
        name: Merge the pull request when it holds only media
        run: |
          others=$(gh pr diff "$BRANCH" --name-only | grep -vE '^(docs/assets/[^/]+\.(png|gif|webm)|demo/demo\.lock)$' || true)
          if [ -n "$others" ]; then
            echo "Not merging: the pull request also changes"; echo "$others"
            exit 0
          fi
          gh pr merge "$BRANCH" --rebase --delete-branch
          # A merge made with the run's token starts no push workflows, so redeploy the site's media by hand.
          gh workflow run pages.yml --ref main

      - if: failure() && steps.check.outputs.stale == 'true'
        name: Report the failure in one issue
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "The Demo media workflow failed again for $GITHUB_SHA: $run"
          else
            gh issue create --title "$TITLE" --label documentation --label demo \
              --body "The Demo media workflow failed for $GITHUB_SHA: $run. The run's log says which step: recording, opening the pull request or merging it. The media on main stays stale until a run succeeds (scripts/demo.sh locally, or re-run the workflow)."
          fi
