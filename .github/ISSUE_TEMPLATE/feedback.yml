name: Idea or feedback
description: Something that would make Fleet Manager more useful, or anything you noticed while using it.
labels: [enhancement]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What you were trying to do, and what would have helped.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fleet Manager version
      description: Optional. Settings → General → Version.
