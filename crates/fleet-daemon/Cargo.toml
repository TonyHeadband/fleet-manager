[package]
name = "fleet-daemon"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
fleet-api = { version = "0.1.0", path = "../fleet-api" }
fleet-fs = { path = "../fleet-fs" }
fleet-log = { path = "../fleet-log" }
futures-util = "0.3"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
tokio-stream = "0.1.19"
tracing = "0.1"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
which = "8.0.6"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
fleet-client = { path = "../fleet-client" }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"

# Test doubles for the claude and gh CLIs. Built with the package so integration tests can find them through
# CARGO_BIN_EXE_*; release builds name `--bin fleet-daemon` and never ship them.
[[bin]]
name = "fake-claude"
path = "tests/bin/fake_claude.rs"
test = false
doc = false

[[bin]]
name = "fake-gh"
path = "tests/bin/fake_gh.rs"
test = false
doc = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
