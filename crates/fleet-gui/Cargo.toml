[package]
name = "fleet-gui"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "fleet_gui"
path = "src/lib.rs"

[[bin]]
name = "fleet-gui"
path = "src/main.rs"

[dependencies]
fleet-api = { path = "../fleet-api" }
fleet-client = { path = "../fleet-client" }
fleet-fs = { path = "../fleet-fs" }
fleet-log = { path = "../fleet-log" }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
serde_json = "1"
tracing = "0.1"
jiff = "0.2.38"

[dev-dependencies]
tempfile = "3"
egui_kittest = "0.37"
