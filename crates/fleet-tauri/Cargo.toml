[package]
name = "fleet-tauri"
description = "Fleet Manager's native app: the web UI in a Tauri window, with the native bridge it needs"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "fleet-gui-tauri"
path = "src/main.rs"

[features]
default = []
# CI's smoke test only (e2e.rs): passes WebDriver's WebView2 flags in code. Never in a release build.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleet-api = { path = "../fleet-api" }
fleet-client = { path = "../fleet-client" }
fleet-fs = { path = "../fleet-fs" }
fleet-log = { path = "../fleet-log" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's own: the window's app id is set through it (main.rs).
glib = "0.18"

[dev-dependencies]
toml = "1.1.8"
tempfile = "3"
