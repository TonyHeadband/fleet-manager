[package]
name = "fleet-demo"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
fleet-api = { path = "../fleet-api" }
fleet-daemon = { path = "../fleet-daemon" }
