[package]
name = "fleet-client"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fleet-api = { path = "../fleet-api" }
fleet-fs = { path = "../fleet-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

toml = "1.1.8"
# Only to change one key of the daemon's config while keeping the user's comments and layout.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
