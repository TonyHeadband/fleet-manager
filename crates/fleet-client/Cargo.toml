[package]
name = "fleet-client"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fleet-api = { path = "../fleet-api" }
fleet-fs = { path = "../fleet-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls: the update check asks GitHub over HTTPS.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# fleet-attach: the same tungstenite tokio-tungstenite brings into the daemon, so one copy builds.
tungstenite = "0.29.0"
# fleet-attach: raw mode and the terminal size only, so no event reader.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

toml = "1.1.8"
# Only to change one key of the daemon's config while keeping the user's comments and layout.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
which = "8.0.6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# shortcuts: writes the Start menu and Desktop .lnk files.
mslnk = "0.1.8"
# fleet-attach: console modes and VT key input, which crossterm's raw mode leaves off. shortcuts: the Desktop folder.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
vt100 = "0.18.1"
