ignore: [docs/**, "**/*.md", mkdocs.yml, .github/**]
steps:
  fmt:
    run: cargo fmt --all --check
  daemon:
    run: cargo test -p fleet-daemon
    paths: [crates/fleet-daemon/**, crates/fleet-client/**]
  gui:
    run: cargo test -p fleet-client -p fleet-gui
    paths: [crates/fleet-gui/**, crates/fleet-client/**]
  shared:
    run: cargo test --workspace
    paths: [crates/fleet-api/**, crates/fleet-log/**, crates/fleet-fs/**, Cargo.toml, Cargo.lock]
  bundle:
    run: bash scripts/test-bundle.sh
    paths: [scripts/bundle.sh, scripts/test-bundle.sh, scripts/lib.sh, packaging/**]
  demo:
    run: cargo test -p fleet-demo
    paths: [crates/fleet-demo/**, demo/**, fixtures/hooks/**, crates/fleet-client/**, crates/fleet-api/**, crates/fleet-daemon/src/status.rs, crates/fleet-daemon/src/hooks_cfg.rs, crates/fleet-daemon/src/repo_rules.rs, crates/fleet-daemon/src/agents.rs, crates/fleet-gui/assets/**]
pr:
  style: conventional-semver-pre1.0
