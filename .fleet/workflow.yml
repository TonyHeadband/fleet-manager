ignore: [docs/**, "**/*.md", mkdocs.yml, .github/**]
steps:
  fmt:
    run: cargo fmt --all --check
  daemon:
    run: cargo test -p fleet-daemon
    paths: [crates/fleet-daemon/**, crates/fleet-client/**]
  gui:
    run: cargo test -p fleet-client -p fleet-gui
    paths: [crates/fleet-gui/**, crates/fleet-client/**]
  shared:
    run: cargo test --workspace
    paths: [crates/fleet-api/**, crates/fleet-log/**, crates/fleet-fs/**, Cargo.toml, Cargo.lock]
  web:
    run: scripts/web.sh
    paths: [web/**]
  packaging:
    run: bash packaging/test-install.sh
    paths: [packaging/**]
  docs-media:
    run: scripts/demo.sh --check
    paths: [crates/fleet-gui/**, crates/fleet-client/**, crates/fleet-api/**, crates/fleet-demo/**, crates/fleet-daemon/src/status.rs, fixtures/hooks/**, demo/**, scripts/demo.sh, Cargo.lock]
  demo:
    run: cargo test -p fleet-demo && bash scripts/test-demo-lock.sh
    paths: [crates/fleet-demo/**, demo/**, fixtures/hooks/**, scripts/demo.sh, scripts/test-demo-lock.sh, crates/fleet-client/**, crates/fleet-api/**, crates/fleet-daemon/src/status.rs, crates/fleet-daemon/src/hooks_cfg.rs, crates/fleet-gui/assets/**]
