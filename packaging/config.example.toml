# Fleet Manager configuration. The daemon and the app both read this file; uncomment what you need.

# Where the daemon listens. Loopback only: there is no authentication in v0.1.
# listen = "127.0.0.1:7878"

# Where it keeps its database, log, agent settings and the clones of repos added by URL
# (repos/<persona>/<product>/<repo>).
# state_dir = "~/.local/share/fleet-manager"

# Branches agents create are named <branch_prefix>/<task-folder-name>.
# branch_prefix = "fleet"

# How Claude Code is started. Manual permission mode makes agents ask before running tools, which is what
# fills the "Needs you" column; your own Claude settings may default to a mode that never asks.
# claude_command = ["claude", "--permission-mode", "default"]

# Where task folders are created, one per task: <tasks_root>/<task-name>.
# tasks_root = "~/fleet-tasks"

# Where personas live, one folder each (<personas_dir>/<name>/claude and /gh): a task's own Claude and GitHub login.
# personas_dir = "~/.local/share/fleet-manager/personas"

# The GitHub CLI, when `gh` is not on PATH.
# gh_command = "gh"

# Fleet-wide caps the orchestrator checks before it acts. Each must be more than 0. They apply after the daemon restarts.
# max_breakdown_versions = 8
# max_steps = 20
# max_parallel_specialists = 3
# Most times one task may try to open its pull request.
# max_pr_attempts = 3

# How pull requests are opened. pr_style names a PR style (conventional-semver-pre1.0, conventional-semver,
# conventional or plain); a product's overrides and the repo's .fleet/workflow.yml can change it.
# pr_style = "plain"
# pr_attribution = ""
# pr_draft = false
# pr_labels = []

# Reserved: read but not used yet.
# [telemetry]
# otlp_endpoint = "http://otel-collector:4317"  # reserved; not used yet
