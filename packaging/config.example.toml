# fleet-manager configuration. The daemon and the app both read this file; uncomment what you need.

# Where the daemon listens. Loopback only: there is no authentication in v0.1.
# listen = "127.0.0.1:7878"

# Where it keeps its database, log, agent settings and the clones of repos added by URL (repos/<name>).
# state_dir = "~/.local/share/fleet-manager"

# Branches agents create are named <branch_prefix>/<project-folder-name>.
# branch_prefix = "fleet"

# How Claude Code is started. Manual permission mode makes agents ask before running tools, which is what
# fills the "Needs you" column; your own Claude settings may default to a mode that never asks.
# claude_command = ["claude", "--permission-mode", "default"]

# The tmux program, when the one on PATH is missing or older than 3.2 (RHEL 8 ships 2.7).
# tmux_command = "~/.local/bin/tmux"

# Where project folders are created, one per project: <projects_root>/<project-name>.
# projects_root = "~/fleet-projects"

# Where personas live, one folder each (<personas_dir>/<name>/claude and /gh): a project's own Claude and GitHub login.
# personas_dir = "~/.local/share/fleet-manager/personas"

# The GitHub CLI, when `gh` is not on PATH.
# gh_command = "gh"

# v0.1 only: the repos agents can work in. Read once to seed the remembered list; after that the app manages
# repos itself. The name becomes a directory name inside every project.
# [[repos]]
# name = "myproject"
# path = "~/dev/myproject"

# Reserved: read but not used yet.
# [telemetry]
# otlp_endpoint = "http://otel-collector:4317"  # reserved; not used yet
