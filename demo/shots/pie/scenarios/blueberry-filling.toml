task = "Prepare the blueberry filling"

[[step]]
after = "0.3s"
say = "Starting with the berries."

[[step]]
after = "0.5s"
tool = "Read"
input = "pantry.toml"
output = ["blueberries, sugar, cornstarch"]

[[step]]
after = "0.6s"
tool = "Bash"
input = "rinse blueberries --cups 2"
output = ["2 cups blueberries, rinsed"]

[[step]]
after = "0.9s"
question = "Lemon zest or cinnamon?"

[[step]]
after = "0.8s"
write = { path = "recipe/filling.md", from = "content/filling.txt" }
commit = "Add the blueberry filling"

[[step]]
after = "1.0s"
tool = "Edit"
input = "recipe/filling.md"
output = ["Added the lemon zest"]

[[step]]
after = "1.4s"
stop = true
