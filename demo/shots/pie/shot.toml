product = "pie"
persona = { name = "Pastry chef", commit_name = "Pastry Chef", commit_email = "chef@pie.example" }
length = "25s"
still_at = "15s"
size = "1400x800"

[pacing]
panel_sequence = true
still = { working = 1, needs_you = 1, review = 1 }

[output]
dir = "docs/assets"
stem = "demo"
still = "board"
formats = ["webm", "gif", "png"]

[[repo]]
name = "bakery"
message = "Start the bakery"

[[task]]
key = "crust"
task = "Make an all-butter crust"
at = "0s"

[[task]]
key = "filling"
task = "Prepare the blueberry filling"
at = "4.6s"

[[task]]
key = "bake"
task = "Bake and plate the pie"
at = "11s"

[[cue]]
at = "6.2s"
answer = { task = "crust", text = "1" }

[[cue]]
at = "12.6s"
answer = { task = "filling", text = "lemon zest" }

[[cue]]
at = "17.3s"
answer = { task = "bake", text = "full top" }

[[cue]]
at = "20.5s"
follow_up = { task = "bake", text = "now make it a lattice top" }

[[cue]]
at = "21.3s"
panel = { task = "bake", tab = "terminal" }

[[cue]]
at = "22.9s"
panel = { task = "bake", tab = "diff" }

[[cue]]
at = "24.4s"
panel_close = true
